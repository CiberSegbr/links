<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Links</title>
    <style>
        /* --- ESTILOS GERAIS (DARK MODE) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #12161a; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 500px; 
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* --- TOPO / HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 1.5rem;
            padding: 0 0.5rem;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            margin: 0 auto; 
            transform: translateX(12px); 
        }

        .share-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .share-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* --- NOVA SEÇÃO: FOTO DE PERFIL --- */
        .profile-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%; /* Torna a foto redonda */
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background-color: #1c2127;
            margin-bottom: 0.75rem;
        }

        .profile-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
        }

        /* --- CARTÕES DE LINK --- */
        .link-card {
            display: flex;
            align-items: center;
            background-color: #1c2127; 
            border-radius: 16px;
            padding: 1rem;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.2s, background-color 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .link-card:hover {
            transform: scale(1.02);
            background-color: #242b33;
        }

        /* Destaque Verde */
        .link-card.featured {
            background-color: #22590c; 
        }

        .link-card.featured:hover {
            background-color: #2b6e11;
        }

        /* Ícones */
        .icon-container {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            flex-shrink: 0;
        }

        .icon-link-default {
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .icon-link-default svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        /* Textos */
        .link-text {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        .link-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-url {
            font-size: 0.85rem;
            color: #94a3b8; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .featured .link-url {
            color: #a3e635; 
        }

        /* Rodapé */
        .footer-text {
            margin-top: auto;
            padding-top: 3rem;
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
        }

        .footer-text a {
            color: #3b82f6;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Topo -->
        <div class="header">
            <h1>Links</h1>
            <button class="share-btn" title="Compartilhar">
                <svg viewBox="0 0 24 24">
                    <path d="M11 14.5V19c0 .6.4 1 1 1s1-.4 1-1v-4.5h3.5c.4 0 .7-.2.9-.5.2-.3.1-.7-.1-1l-4.9-5.2c-.4-.4-1-.4-1.4 0l-4.9 5.2c-.3.3-.4.7-.2 1 .2.3.5.5.9.5H11zM18 4H6c-1.1 0-2 .9-2 2v2c0 .6.4 1 1 1s1-.4 1-1V6c0-.5.5-1 1-1h12c.5 0 1 .5 1 1v2c0 .6.4 1 1 1s1-.4 1-1V6c0-1.1-.9-2-2-2z"/>
                </svg>
            </button>
        </div>

        <!-- Seção do Perfil (Foto + Seu Nome) -->
        <div class="profile-section">
            <!-- COLOQUE SUA FOTO: Substitua 'perfil.jpg' pelo nome do seu arquivo de foto ou um link da internet -->
            <img class="profile-img" src="perfil.jpg" alt="Sua Foto de Perfil">
            <div class="profile-name">@seu_usuario</div>
        </div>

        <!-- Link 1: IA Creator PRO (Destaque Verde) -->
        <!-- SUBSTITUA O 'href' pelo seu link real -->
        <a href="https://SEU_LINK_AQUI.com" target="_blank" class="link-card featured">
            <div class="icon-container">
                <svg class="avatar-img" viewBox="0 0 100 100" style="background-color: #a3e635;">
                    <path d="M20 30h10v10H20zm10-10h10v10H30zm30 0h10v10H60zm10 10h10v10H70zM20 50h60v10H20zm10 10h40v10H30zm-10 10h10v10H20zm50 0h10v10H70z" fill="#0f172a"/>
                </svg>
            </div>
            <div class="link-text">
                <span class="link-title">IA Creator PRO</span>
                <span class="link-url">iacreatorpro.com</span>
            </div>
        </a>

        <!-- Link 2: Dreamina -->
        <!-- SUBSTITUA O 'href' pelo seu link real -->
        <a href="https://SEU_LINK_AQUI.com" target="_blank" class="link-card">
            <div class="icon-container icon-link-default">
                <svg viewBox="0 0 24 24">
                    <path d="M3.9 12c0-1.7 1.4-3.1 3.1-3.1h4V7H7c-2.8 0-5 2.2-5 5s2.2 5 5 5h4v-1.9H7c-1.7 0-3.1-1.4-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.7 0 3.1 1.4 3.1 3.1s-1.4 3.1-3.1 3.1h-4V17h4c2.8 0 5-2.2 5-5s-2.2-5-5-5z"/>
                </svg>
            </div>
            <div class="link-text">
                <span class="link-title">Dreamina</span>
                <span class="link-url">bit.ly/nandaodim</span>
            </div>
        </a>

        <!-- Link 3: Megavazamento -->
        <!-- SUBSTITUA O 'href' pelo seu link real -->
        <a href="https://SEU_LINK_AQUI.com" target="_blank" class="link-card">
            <div class="icon-container icon-link-default">
                <svg viewBox="0 0 24 24">
                    <path d="M3.9 12c0-1.7 1.4-3.1 3.1-3.1h4V7H7c-2.8 0-5 2.2-5 5s2.2 5 5 5h4v-1.9H7c-1.7 0-3.1-1.4-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.7 0 3.1 1.4 3.1 3.1s-1.4 3.1-3.1 3.1h-4V17h4c2.8 0 5-2.2 5-5s-2.2-5-5-5z"/>
                </svg>
            </div>
            <div class="link-text">
                <span class="link-title">Megavazamento</span>
                <span class="link-url">casomegavazamento.com</span>
            </div>
        </a>

        <!-- Rodapé -->
        <div class="footer-text">
            Crie uma página de links compartilhável com o <a href="#">Meta One</a>.
        </div>

    </div>

</body>
</html>
